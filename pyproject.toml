[project]
name = "mcps2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AgustinRT", email = "a.rodilla.tierz@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "kafka-python>=3.0.12",
    "mcp[cli]>=2.3.0",
    "pydantic>=2.14.2",
    "pytest>=9.2.0",
    "testcontainers[kafka]>=4.15.0",
]

[project.scripts]
mcps2 = "mcps2:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
